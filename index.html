<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  
<link rel="stylesheet" href="style.css">
</head>
<body>
  <section>
      <nav>
        <img src="assets/FES.svg" class="logo" alt="">
        <ul>
          <li><a href="#about">About</a></li>
          <li><a href="#discord">Discord</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
      <header>
        <div class="row">
        <div>
          <h1>Best place to learn frontend</h1>
          <p class="subheader">Go from being a beginner to being a pro with a simplified process.</p>
          <button>Start Now!</button>
        </div>
        <figure><img src="assets/laptop.png" alt="home page image"></figure>
        </div>
      </header>
  </section>
  <main>
    <section id="about">
      <h2>About</h2>
      <div class="row">
      <div class="section__discription">
        <div class="section__discription--wrapper"
      <p class="section__description-paragraph">This is my first project in HTML </p>
      </div>
      <figure class="about__img--wrapper">
        <img src="assets/about.jpg" alt="">
      </figure>
      </div>
    </section>
    <section id="discord">
      <h2>Discord</h2>
      <div class="row">
      <div class="section__discription">
        <div class="section__discription--wrapper">
          <p class="section__description-paragraph">Get in touch through my Discord server!</p>
        </div>
      </div>
      <figure class="about__img--wrapper">
      <img src="assets/discord.png" alt="">
      </figure>
      </div>
    </section>
    
    <section id="contact">
      <h2>Contact</h2>
      <form action="">
          <span>Email</span>
          <input type="email" placeholder="gbruhl6@example.com">
          <span>Message</span>
          <textarea type="text" placeholder="gbruhl6@example.com">
          </textarea>
          <button>Contact Us!</button>
      </form>
    </section>
    
  </main>

  <footer>
    <img class="footer__Logo"src="assets/FES.svg" alt="">
    <div class="footer__link">
      <a class="footer__link" href="#about">About</a>
      <a class="footer__link" href="#discord">Discord</a>
      <a class="footer__link" href="#contact">Contact</a>
      <a class="footer__link" href="Courses"></a>
    </div>
    <p>Copyright frontend simplified</p>
  </footer>
</body>
</html>
